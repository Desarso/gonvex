[workspace]
resolver = "2"
members = [
  "crates/module-runtime",
  "crates/module-runtime-v8",
  "crates/module-runtime-wasm",
  "crates/server",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
