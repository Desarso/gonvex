[workspace]
resolver = "2"
members = [
  "crates/module-runtime",
  "crates/module-runtime-v8",
  "crates/module-runtime-wasm",
  "crates/server",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
# deno_core moves its op, module, and event-loop APIs between minor releases,
# so the V8 adapter tracks one version deliberately instead of floating.
deno_core = "0.320"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
