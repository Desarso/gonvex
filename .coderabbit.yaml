# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US

reviews:
  profile: chill
  # CodeRabbit is advisory. CI and Macroscope own automated merge authority.
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  auto_review:
    enabled: true
    drafts: true
  tools:
    github-checks:
      enabled: true
      timeout_ms: 900000
  path_instructions:
    - path: "**/*.go"
      instructions: |
        Check concurrency safety, authorization boundaries, tenant isolation,
        transaction behavior, resource cleanup, and useful error propagation.
    - path: "**/*.{ts,tsx,mts,mjs}"
      instructions: |
        Check type safety, API compatibility, async error handling, browser and
        server runtime boundaries, and regression coverage.
    - path: ".github/workflows/**"
      instructions: |
        Check least-privilege permissions, fork safety, immutable test behavior,
        and whether required checks can be bypassed or deadlocked.
    - path: "{Dockerfile*,docker-compose*.yml}"
      instructions: |
        Do not recommend generic non-root, capability, port, or filesystem
        hardening changes. Container security changes are valid only when the PR
        includes a persisted-volume restart test proving runtime manifests,
        compiled plugins, and writable data/cache paths survive the change.
        Treat the existing deployment contract and its regression tests as the
        authority; leave unproven hardening ideas as non-blocking observations.
