name: CodeRabbit Gate

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  pull_request_review:
    types:
      - submitted
      - dismissed
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: coderabbit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  require-coderabbit-approval:
    name: CodeRabbit review
    if: >-
      github.event_name != 'workflow_dispatch' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require CodeRabbit review of the current commit
        uses: actions/github-script@v8
        with:
          script: |
            const pullRequest = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const reviews = await github.paginate(
              github.rest.pulls.listReviews,
              {
                owner,
                repo,
                pull_number: pullRequest.number,
                per_page: 100,
              },
            );

            const codeRabbitReviews = reviews
              .filter((review) => {
                const login = review.user?.login?.toLowerCase();
                return login === 'coderabbitai[bot]' || login === 'coderabbitai';
              })
              .sort((left, right) => left.id - right.id);

            const latestReview = codeRabbitReviews.at(-1);
            if (!latestReview) {
              core.setFailed('CodeRabbit has not reviewed this pull request yet.');
              return;
            }

            if (latestReview.commit_id !== pullRequest.head.sha) {
              core.setFailed('CodeRabbit has not reviewed the latest commit.');
              return;
            }

            core.info(
              `CodeRabbit completed a ${latestReview.state} review for commit ${pullRequest.head.sha}.`,
            );
