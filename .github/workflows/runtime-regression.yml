name: Runtime regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: runtime-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.1.2 --activate
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Validate repository script contracts
        run: node --test scripts/*.test.mjs
      - name: Test Go runtime
        run: go test -count=1 -p 1 ./...
        env:
          GOMAXPROCS: "2"
      - name: Build JavaScript packages
        run: pnpm build:packages
      - name: Test JavaScript workspace
        run: pnpm -r test
      - name: Type-check JavaScript workspace
        run: pnpm typecheck

  deploy-dev-runtime:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: gonvex-runtime
    concurrency:
      group: gonvex-dev-runtime-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Deploy exact runtime commit to Coolify
        run: node scripts/deploy-coolify.mjs
        env:
          COOLIFY_API_URL: ${{ vars.COOLIFY_API_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          # Main is the development release lane. Production is promoted only
          # after the corresponding Monitor verification passes.
          COOLIFY_SERVICE_UUIDS: ftfmdopfb3j0e88s0crl6iny
          GONVEX_DEPLOY_SHA: ${{ github.sha }}
